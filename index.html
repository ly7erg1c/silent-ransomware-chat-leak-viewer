<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Chat Archive Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5455c'/%3E%3Cpath d='M16 6c4 3 6 7 6 11l-3 4h-6l-3-4c0-4 2-8 6-11z' fill='%23fff'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%23f5455c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <aside id="sidebar" class="sidebar" aria-label="Rooms">
    <div class="sb-top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#f5455c"/><path d="M16 5.5c4.2 3 6.4 7.2 6.4 11.5l-3.2 4.2h-6.4L9.6 17c0-4.300 2.200-8.500 6.400-11.500z" fill="#fff"/><circle cx="16" cy="13.500" r="2.100" fill="#f5455c"/><path d="M12.600 21.200 11 25.500l3.200-1.600zM19.400 21.200 21 25.500l-3.200-1.600z" fill="#fff"/></svg>
        <div class="brand-text"><b>Chat Archive</b><span>Bilingual viewer</span></div>
      </div>
      <button id="sb-close" class="icon-btn only-mobile" aria-label="Close sidebar">&#x2715;</button>
    </div>

    <div class="ws-switch" id="ws-switch" role="tablist" aria-label="Workspace"></div>

    <div class="sb-search">
      <svg viewBox="0 0 24 24" class="ico"><path d="M10 4a6 6 0 104.5 10l5 5 1.400-1.400-5-5A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z" fill="currentColor"/></svg>
      <input id="room-filter" type="search" placeholder="Search rooms" autocomplete="off" spellcheck="false">
    </div>

    <nav id="room-list" class="room-list"></nav>

    <div class="sb-foot">
      <span id="foot-note"></span>
    </div>
  </aside>

  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="room-header">
      <button id="sb-open" class="icon-btn only-mobile" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" fill="currentColor"/></svg>
      </button>
      <div class="rh-title">
        <span id="rh-icon" class="rh-icon"></span>
        <div class="rh-text">
          <div id="rh-name" class="rh-name">Select a room</div>
          <div id="rh-sub" class="rh-sub"></div>
        </div>
      </div>
      <div class="rh-actions">
        <div class="seg" id="mode-seg" role="radiogroup" aria-label="Language view">
          <button data-mode="en" role="radio" title="Show English translation">English</button>
          <button data-mode="orig" role="radio" title="Show original text">Original</button>
          <button data-mode="both" role="radio" title="Show both">Both</button>
        </div>
        <label class="date-jump" title="Jump to date">
          <svg viewBox="0 0 24 24" class="ico"><path d="M7 2v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z" fill="currentColor"/></svg>
          <input id="date-input" type="date" aria-label="Jump to date">
        </label>
        <button id="btn-search" class="icon-btn" title="Search messages (/)" aria-label="Search messages">
          <svg viewBox="0 0 24 24" class="ico"><path d="M10 4a6 6 0 104.5 10l5 5 1.400-1.400-5-5A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z" fill="currentColor"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 3a9 9 0 109 9c0-.5 0-1-.1-1.400A6 6 0 0113.400 3.100 9 9 0 0012 3z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <section class="chat-col">
        <div id="chat" class="chat mode-en" tabindex="0" aria-live="off">
          <div class="empty">
            <svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#f5455c"/><path d="M16 5.500c4.200 3 6.400 7.200 6.400 11.500l-3.200 4.200h-6.400L9.600 17c0-4.300 2.200-8.500 6.400-11.500z" fill="#fff"/><circle cx="16" cy="13.500" r="2.100" fill="#f5455c"/></svg>
            <p>Loading&hellip;</p>
          </div>
        </div>
        <button id="to-bottom" class="to-bottom" hidden aria-label="Jump to latest">&#x2193; Jump to latest</button>
        <div class="composer" aria-hidden="true">
          <div class="composer-box">Read-only archive &mdash; no messages can be sent.</div>
        </div>
      </section>

      <aside id="search-panel" class="search-panel" hidden aria-label="Search">
        <div class="sp-head">
          <b>Search messages</b>
          <button id="sp-close" class="icon-btn" aria-label="Close search">&#x2715;</button>
        </div>
        <div class="sp-controls">
          <input id="search-input" type="search" placeholder="Search Russian or English text" autocomplete="off" spellcheck="false">
          <div class="seg seg-sm" id="scope-seg">
            <button data-scope="room">This room</button>
            <button data-scope="all">All rooms</button>
          </div>
        </div>
        <div id="sp-status" class="sp-status"></div>
        <div id="sp-results" class="sp-results"></div>
      </aside>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
